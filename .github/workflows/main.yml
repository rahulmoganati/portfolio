
name: Deploy Portfolio to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Deployment Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST secret is missing"
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is missing"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "::error::EC2_USER secret is missing"
            exit 1
          fi

          echo "All required deployment secrets are configured."

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy Portfolio
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github -czf - . |
            ssh "$EC2_USER@$EC2_HOST" \
            "sudo tar -xzf - -C /var/www/html --no-same-owner &&
             sudo nginx -t &&
             sudo systemctl reload nginx"

      - name: Deployment Complete
        run: echo "Portfolio deployed successfully!"
